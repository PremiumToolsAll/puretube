group 'dev.puretube.playback'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.21'
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'dev.puretube.playback'
    compileSdk 35
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
}

repositories { google(); mavenCentral() }

dependencies {
    implementation files('libs/newpipeextractor-0.26.5-android-compat.jar')
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'org.mozilla:rhino:1.8.1'
    implementation 'org.mozilla:rhino-engine:1.8.1'
    implementation 'com.google.protobuf:protobuf-javalite:4.35.1'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation files('libs/nanojson-e9d656ddb49a412a5a0a5d5ef20ca7ef09549996.jar')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
