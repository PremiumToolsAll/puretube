name: puretube_playback
description: Android NewPipe extraction and synchronized Media3 audio/video playback for Flutter.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.puretube.playback
        pluginClass: PureTubePlaybackPlugin
