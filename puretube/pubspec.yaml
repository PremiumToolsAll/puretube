name: pure_tube
description: PureTube - an ad-free YouTube client.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9

  # Video playback (mpv-powered: custom controls, PiP-friendly, background-capable)
  media_kit: ^1.1.10
  media_kit_video: ^1.2.0
  media_kit_libs_video: ^1.0.0

  # YouTube stream extraction (no API key, no official client)
  youtube_explode_dart: ^3.1.0

  # Background audio + lockscreen / notification controls
  audio_service: ^0.18.9

  # Local database: history, bookmarks, playlists, downloads
  # (hive_ce = maintained community fork; original hive/isar are discontinued)
  hive_ce: ^2.0.0
  hive_ce_flutter: ^1.0.0

  # Downloads
  dio: ^5.4.0

  # Networking & utilities
  http: ^1.2.0
  connectivity_plus: ^6.0.0
  path_provider: ^2.1.2
  cached_network_image: ^3.3.0
  permission_handler: ^11.0.0
  screen_brightness: ^2.0.0

  # Share & links
  share_plus: ^10.1.4
  url_launcher: ^6.2.4
  package_info_plus: ^8.3.1

  # UI polish
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0
  shared_preferences: ^2.3.2

  # Crash reporting (works without DSN; user adds real DSN later)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

# Patched youtube_explode_dart: fixes NoSuchMethodError 'getT' in search
# parsing (extension methods don't resolve on dynamic values from
# firstOrNull/elementAtSafe). See packages/youtube_explode_dart/.
dependency_overrides:
  youtube_explode_dart:
    path: packages/youtube_explode_dart
